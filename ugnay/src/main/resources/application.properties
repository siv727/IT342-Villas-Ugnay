spring.application.name=ugnay

spring.config.import=optional:env[.env]

spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT}/${SUPABASE_DB_NAME}?prepareThreshold=0
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
application.security.jwt.expiration=900000
application.security.jwt.refresh-expiration=604800000

# File upload size limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Third-Party API Configuration =====

# Google OAuth
application.google.client-id=${GOOGLE_CLIENT_ID}

# Gmail SMTP (Email Notifications)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.port=465

# PSGC API (Philippine Geographic Codes)
application.psgc.api-url=https://psgc.cloud/api

# Supabase Storage (File Upload)
application.supabase.url=${SUPABASE_URL}
application.supabase.service-key=${SUPABASE_SERVICE_KEY}
application.supabase.bucket=ugnay-files

# PayMongo (Payment Processing - Sandbox)
application.paymongo.secret-key=${PAYMONGO_SECRET_KEY}
application.paymongo.api-url=https://api.paymongo.com/v1

# Debug logging for Spring Security (set to TRACE for detailed debugging)
logging.level.org.springframework.security=WARN